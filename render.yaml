services:
  # ====================================================
  # Backend Web Service (Node.js / Express API)
  # ====================================================
  - type: web
    name: sports-council-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: MASTER_OTP
        value: "987654"

  # ====================================================
  # Frontend Static Site (Vite / React SPA)
  # ====================================================
  - type: web
    name: sports-council-client
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # React Router SPA catch-all rewrite
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
